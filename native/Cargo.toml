[package]
name = "xmlstreamer-native"
version = "2.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_xmlstreamer"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
# Both crates must come from the same git source: rypipe-python uses a path
# dependency on rypipe-core, so a crates.io rypipe-core would compile a second
# copy and the Splitter/RecordParser traits would not unify.
rypipe-core = { git = "https://github.com/emiliano-go/rypipe", rev = "364526945a22076d1b347bbd62804d54f1af37fc", features = ["mmap", "compress-all"] }
rypipe_python = { package = "rypipe-python", git = "https://github.com/emiliano-go/rypipe", rev = "364526945a22076d1b347bbd62804d54f1af37fc" }
memchr = "2"
simdutf8 = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
