[package]
name = "xmlstreamer-native"
version = "2.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_xmlstreamer"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
rypipe-core = "0.4"
memchr = "2"
simdutf8 = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
